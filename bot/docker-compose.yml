services:
  bot:
    build: .
    container_name: opengtd-bot
    env_file:
      - .env
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Túnel público para o webhook do Telegram (painel em http://localhost:4040)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: opengtd-ngrok
    command: http bot:8000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_TOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - bot
    restart: unless-stopped
